<div class="form-group">
    <label for="id_nombre">Nombre completo</label>
    <input type="text" class="form-control" id="id_nombre" name="nombre" required>
</div>

<div class="form-group">
    <label for="id_direccion">Dirección</label>
    <input type="text" class="form-control" id="id_direccion" name="direccion" required>
</div>

<div class="form-group">
    <label for="id_telefono">Teléfono <small class="text-muted">(10 dígitos)</small></label>
    <input type="tel" class="form-control" id="id_telefono" name="telefono" 
           maxlength="10" pattern="[0-9]{10}" 
           placeholder="1234567890" required>
    <small class="form-text text-muted">Ingresa solo números, sin espacios ni guiones</small>
</div>
